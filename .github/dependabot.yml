# Dependency updates. Locks are committed on purpose:
#   - Cargo.lock keeps release builds and the security-motivated pins reproducible
#   - apps/xenterm/pubspec.lock is what the Flutter CI and release workflow use
# Keep this file in sync with the toolchain versions pinned in CI
# (Flutter `3.47.7`, Rust `stable`); a dependency bump is only verified by CI.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pub
    directory: "/apps/xenterm"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      flutter-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
