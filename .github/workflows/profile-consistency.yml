name: Profile consistency tests

on:
  push:
    paths: ["Cargo.toml", "Cargo.lock", "src/config/**", ".github/workflows/profile-consistency.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "src/config/**", ".github/workflows/profile-consistency.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: ${{ matrix.os }} profile transactions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-consistency-${{ runner.os }}
      # Uses the same stable/MSVC toolchain on Windows, with no GUI system
      # dependencies, credentials, publishing permissions, or real profiles.
      - run: cargo test --locked --no-default-features --features headless --jobs 2 config::config -- --nocapture
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Install synthetic Windows SSH fixture dependencies
        if: runner.os == 'Windows'
        run: python -m pip install cryptography paramiko
      - name: Build Windows headless CLI fixture
        if: runner.os == 'Windows'
        run: cargo build --locked --no-default-features --features headless --jobs 2
      - name: Windows portable export and import CLI E2E
        if: runner.os == 'Windows'
        run: python tests/config_export_e2e.py --exe target/debug/xenterm.exe
