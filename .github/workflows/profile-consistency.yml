name: Profile consistency tests

on:
  push:
    paths: ["Cargo.toml", "Cargo.lock", "src/config/**", "src/cli/**", "src/main.rs", "tests/migration_modes_e2e.py", "tests/migration_preview_e2e.py", ".github/workflows/profile-consistency.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "src/config/**", "src/cli/**", "src/main.rs", "tests/migration_modes_e2e.py", "tests/migration_preview_e2e.py", ".github/workflows/profile-consistency.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: ${{ matrix.os }} profile transactions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-consistency-${{ runner.os }}
      # Uses the same stable/MSVC toolchain on Windows, with no GUI system
      # dependencies, credentials, publishing permissions, or real profiles.
      - run: cargo test --locked --no-default-features --features headless --jobs 2 config::config -- --nocapture
      - name: Build the headless CLI binary
        run: cargo build --locked --no-default-features --features headless --jobs 2
      - name: Stable-ID import and native snapshot migration
        run: python tests/migration_modes_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"
      - name: Read-only full CLI migration previews
        run: python tests/migration_preview_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"
