name: Flutter desktop bundles

# release.yml publishes the Rust CLI from main/tags. The Flutter branch has a
# different executable and requires the Rust FFI bridge in the same bundle.
on:
  push:
    branches: [flutter]
  pull_request:
    branches: [flutter]

permissions:
  contents: read

jobs:
  bundle:
    name: Flutter ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, platform: linux-x64 }
          - { runner: windows-latest, platform: windows-x64 }
          - { runner: macos-14, platform: macos-arm64 }
    defaults:
      run:
        shell: bash
    env:
      # The committed pubspec.lock uses this host; using pub.dev here rewrites
      # all package URLs (and sometimes upgrades transitive dependencies).
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libudev-dev libdbus-1-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: flutter-bridge-${{ matrix.platform }}
      - name: Install locked Flutter dependencies
        working-directory: apps/xenterm
        run: flutter pub get --enforce-lockfile
      - name: Test Flutter UI
        if: runner.os == 'Linux'
        working-directory: apps/xenterm
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build Flutter desktop UI
        working-directory: apps/xenterm
        run: |
          case "${{ runner.os }}" in
            Linux) flutter build linux --release --no-pub ;;
            Windows) flutter build windows --release --no-pub ;;
            macOS) flutter build macos --release --no-pub ;;
          esac
      - name: Build Rust FFI bridge
        run: cargo build --locked --release -p xenterm-bridge
      - name: Assemble and verify complete bundle
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              bundle="apps/xenterm/build/linux/x64/release/bundle"
              cp target/release/libxenterm_bridge.so "$bundle/"
              test -s "$bundle/xenterm_app"
              test -s "$bundle/libxenterm_bridge.so"
              test -s "$bundle/lib/libflutter_linux_gtk.so"
              test -d "$bundle/data/flutter_assets"
              tar -C "$(dirname "$bundle")" -czf "xenterm-flutter-linux-x64.tar.gz" bundle
              ;;
            Windows)
              bundle="apps/xenterm/build/windows/x64/runner/Release"
              cp target/release/xenterm_bridge.dll "$bundle/"
              test -s "$bundle/xenterm_app.exe"
              test -s "$bundle/xenterm_bridge.dll"
              test -s "$bundle/flutter_windows.dll"
              test -d "$bundle/data/flutter_assets"
              (cd "$bundle" && 7z a "$GITHUB_WORKSPACE/xenterm-flutter-windows-x64.zip" . >/dev/null)
              ;;
            macOS)
              app="apps/xenterm/build/macos/Build/Products/Release/xenterm_app.app"
              cp target/release/libxenterm_bridge.dylib "$app/Contents/MacOS/"
              test -s "$app/Contents/MacOS/xenterm_app"
              test -s "$app/Contents/MacOS/libxenterm_bridge.dylib"
              test -d "$app/Contents/Frameworks/App.framework"
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict "$app"
              ditto -c -k --keepParent "$app" xenterm-flutter-macos-arm64.zip
              ;;
          esac
      - name: Upload Flutter desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: xenterm-flutter-${{ matrix.platform }}
          path: xenterm-flutter-${{ matrix.platform }}.*
          if-no-files-found: error
