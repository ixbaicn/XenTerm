name: CI

# Consolidated push/PR gate (formerly desktop-check.yml, profile-consistency.yml,
# remote-mcp.yml and installer-check.yml):
#   - desktop: compile + isolated GUI tests on all three OSes
#   - headless-e2e: headless unit tests + Python end-to-end regressions
#   - migration-e2e: isolated migration CLI regressions on all three OSes
#   - installer: Linux install-script syntax + regressions
# Release packaging lives in release.yml.

on:
  push:
    paths: ["Cargo.toml", "Cargo.lock", "crates/xenterm/**", "apps/xenterm/**", "scripts/version.sh", "crates/xenterm/tests/*_e2e.py", "crates/xenterm/tests/tls_proxy_fixture.py", "assets/install-linux.sh", "crates/xenterm/tests/install_linux_test.py", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/xenterm/**", "apps/xenterm/**", "scripts/version.sh", "crates/xenterm/tests/*_e2e.py", "crates/xenterm/tests/tls_proxy_fixture.py", "assets/install-linux.sh", "crates/xenterm/tests/install_linux_test.py", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: Linux desktop }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: Windows desktop }
          - { os: macos-14, target: aarch64-apple-darwin, name: macOS desktop }
    steps:
      - uses: actions/checkout@v4
      # 版本号规范 v1 §4/§7: resolve the version through the single entry
      # point, re-check the §1 format here, and pin it for the cargo steps so
      # the built test binaries embed exactly this string.
      - name: Resolve app version
        shell: bash
        run: |
          set -eu
          V="$(bash scripts/version.sh)"
          printf '%s' "$V" | grep -Eq \
            '^xt-(v[0-9]+\.[0-9]+\.[0-9]+|(beta|alpha|dev)-[0-9a-f]{7}-T[0-9]{10})$' \
            || { echo "scripts/version.sh produced an invalid version: $V"; exit 1; }
          echo "XT_VERSION=$V" >> "$GITHUB_ENV"
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev \
            libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check-${{ matrix.target }}
      # Keep the upstream stable/MSVC Windows configuration. Debug checking
      # avoids the release-only fxc.exe shader compilation and package tooling.
      - run: cargo check --locked --target ${{ matrix.target }} --jobs 2
      # Separate invocations so PowerShell cannot hide a failing first command
      # behind the second native command's successful exit status.
      - name: Test session editor interactions
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-gui-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-gui-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-gui-runtime
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 ui::session_editor::tests
      - name: Test native dialog interactions
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-gui-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-gui-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-gui-runtime
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 ui::dialog_parity_tests
      - name: Test complete desktop regression suite on Linux
        if: runner.os == 'Linux'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-full-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-full-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-full-runtime
        # Include this PR's regressions and the tests merged from upstream.
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 -- --test-threads=1
      # Config profile transactions outside Linux (from the former
      # profile-consistency.yml; on Linux the full suite above covers them).
      - name: Test config profile transactions
        if: runner.os != 'Linux'
        run: cargo test --locked --no-default-features --features headless --target ${{ matrix.target }} --jobs 2 config::config

  flutter-checks:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Analyze
        working-directory: apps/xenterm
        run: |
          flutter pub get
          flutter analyze
      - name: Widget tests
        working-directory: apps/xenterm
        run: flutter test

  # Compile the real desktop application (not just the Rust core) so a release
  # archive can never regress to "UI missing".
  flutter-desktop:
    name: Flutter desktop build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, name: linux }
          - { os: windows-latest, platform: windows, name: windows }
          - { os: macos-15, platform: macos, name: macos }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build clang libgtk-3-dev liblzma-dev libstdc++-12-dev libudev-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-flutter-${{ matrix.name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Build FFI bridge
        run: cargo build --release --locked -p xenterm-bridge
      - name: Build desktop app
        working-directory: apps/xenterm
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --release
      - name: Verify the bridge is bundled
        shell: bash
        run: bash apps/xenterm/tool/bundle_native.sh

  migration-e2e:
    name: ${{ matrix.os }} migration CLI regression
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: migration-cli-${{ runner.os }}
      # Synthetic independent profiles only; no GUI dependencies or real credentials.
      # serialport's Linux enumeration needs libudev; it is not a GUI dependency.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - name: Build the headless CLI binary
        run: cargo build -p xenterm --locked --no-default-features --features headless --jobs 2
      - name: Stable-ID import and native snapshot migration
        run: python crates/xenterm/tests/migration_modes_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"
      - name: Read-only full CLI migration previews
        run: python crates/xenterm/tests/migration_preview_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"

  headless-e2e:
    name: Headless MCP regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nginx libudev-dev pkg-config
      - run: python -m pip install cryptography paramiko "mcp>=2.3,<3"
      - name: Headless unit tests (no GUI system dependencies)
        run: env -u ALL_PROXY -u all_proxy -u HTTP_PROXY -u http_proxy -u HTTPS_PROXY -u https_proxy cargo test -p xenterm --locked --no-default-features --features headless
      - run: cargo build -p xenterm --locked --no-default-features --features headless
      - run: python crates/xenterm/tests/config_import_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/config_export_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/cli_exec_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/access_policy_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/execution_log_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/migration_modes_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/migration_preview_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/ssh_jump_chain_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/ssh_stack_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/ssh_jump_chain_e2e.py --exe target/debug/xenterm --stage-timeouts
      - run: python crates/xenterm/tests/stdio_mcp_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/remote_mcp_e2e.py --exe target/debug/xenterm --path /mcp
      - run: python crates/xenterm/tests/remote_mcp_e2e.py --exe target/debug/xenterm --nginx /usr/sbin/nginx --path /xenterm/mcp
      - run: python crates/xenterm/tests/remote_mcp_e2e.py --exe target/debug/xenterm --nginx /usr/sbin/nginx --path /xenterm/mcp --protocol-version 2025-11-25

  windows-ssh:
    name: Windows SSH command stack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-ssh-stack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography paramiko
      - run: cargo test -p xenterm --locked --no-default-features --features headless command_stack_tests
      - run: cargo build -p xenterm --locked --no-default-features --features headless
      - run: python crates/xenterm/tests/ssh_stack_e2e.py --exe target/debug/xenterm.exe
      - run: python crates/xenterm/tests/migration_modes_e2e.py --exe target/debug/xenterm.exe
      - run: python crates/xenterm/tests/migration_preview_e2e.py --exe target/debug/xenterm.exe

  installer:
    name: Linux installer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils python3-gi gir1.2-glib-2.0
      - name: Check installer syntax
        run: bash -n assets/install-linux.sh
      - name: Run isolated installer regressions
        run: /usr/bin/python3 crates/xenterm/tests/install_linux_test.py
